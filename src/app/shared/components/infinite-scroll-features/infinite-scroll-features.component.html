<!-- Server Features - Infinite Horizontal Scroll - Full Width -->
<div class="w-full py-12 pb-0 pt-0">
  <div class="server-features-scroll-wrapper">
    <div #serverFeaturesScroll class="server-features-scroll-content"
      (mouseenter)="onMouseEnter()" 
      (mouseleave)="onMouseLeave()"
      (touchstart)="onTouchStart()"
      (touchend)="onTouchEnd()">
      @for (feature of displayedFeatures(); track feature.id) {
      <!-- Card with internal route -->
      @if (feature.route) {
      <a [routerLink]="feature.route" class="minecraft-feature-card">
        <div class="minecraft-feature-image">
          <img [src]="feature.image" [alt]="feature.label" loading="lazy" />
        </div>
        <div class="minecraft-feature-label">
          {{ feature.label }}
        </div>
      </a>
      }
      <!-- Card with external link -->
      @else if (feature.href) {
      <a [href]="feature.href" [target]="feature.target || '_blank'"
        [rel]="feature.target === '_blank' ? 'noopener noreferrer' : ''" class="minecraft-feature-card">
        <div class="minecraft-feature-image">
          <img [src]="feature.image" [alt]="feature.label" loading="lazy" />
        </div>
        <div class="minecraft-feature-label">
          {{ feature.label }}
        </div>
      </a>
      }
      <!-- Card without link -->
      @else {
      <div class="minecraft-feature-card">
        <div class="minecraft-feature-image">
          <img [src]="feature.image" [alt]="feature.label" loading="lazy" />
        </div>
        <div class="minecraft-feature-label">
          {{ feature.label }}
        </div>
      </div>
      }
      }
    </div>
  </div>
</div>
