<!-- Features Section - Infinite Horizontal Scroll -->
<div class="bg-gray-900 py-16 overflow-hidden">
  <div class="infinite-scroll-wrapper">
    <div #scrollContainer class="infinite-scroll-content" 
      (mouseenter)="onMouseEnter()" 
      (mouseleave)="onMouseLeave()"
      (touchstart)="onMouseEnter()"
      (touchend)="onMouseLeave()">
      @for (feature of displayedFeatures(); track feature.id) {
      <div class="minecraft-card cursor-pointer flex-shrink-0" [routerLink]="[feature.route]" [ngClass]="{
          'border-green-500': feature.color === 'green',
          'border-orange-500': feature.color === 'orange',
          'border-blue-500': feature.color === 'blue'
        }">
        <div class="aspect-square overflow-hidden bg-gray-800 relative">
          <img [src]="feature.image" [alt]="feature.title" class="w-full h-full object-cover" />
        </div>
        <div class="p-6 text-center bg-gray-800">
          <h3 class="text-xl font-bold text-white mb-2 font-minecraft">
            {{ feature.title }}
          </h3>
          <p class="text-gray-400 font-minecraft-sign text-sm">
            {{ feature.description }}
          </p>
        </div>
      </div>
      }
    </div>
  </div>
</div>
