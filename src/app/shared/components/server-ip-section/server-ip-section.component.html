<!-- Desktop IP Section -->
<div class="hidden md:flex items-center justify-center space-x-4 mb-6">
  <div class="flex items-center bg-gray-800 border-4 border-gray-600 rounded-lg overflow-hidden">
    <span class="px-4 py-2 bg-gray-700 text-gray-300 font-minecraft-sign text-sm border-r-2 border-gray-600">
      IP
    </span>
    <input
      type="text"
      readonly
      [value]="ip()"
      class="px-4 py-2 bg-gray-800 text-white font-minecraft-sign text-sm w-64 focus:outline-none" />
    <button
      (click)="copyIp()"
      class="px-4 py-2 bg-yellow-600 hover:bg-yellow-700 text-black font-minecraft text-sm font-bold transition-colors border-l-2 border-yellow-700">
      COPIAR
    </button>
  </div>
  <div class="flex items-center bg-gray-800 border-4 border-gray-600 rounded-lg overflow-hidden">
    <span class="px-4 py-2 bg-gray-700 text-gray-300 font-minecraft-sign text-sm border-r-2 border-gray-600">
      PORTA
    </span>
    <input
      type="text"
      readonly
      [value]="port()"
      class="px-4 py-2 bg-gray-800 text-white font-minecraft-sign text-sm w-24 focus:outline-none" />
    <button
      (click)="copyPort()"
      class="px-4 py-2 bg-yellow-600 hover:bg-yellow-700 text-black font-minecraft text-sm font-bold transition-colors border-l-2 border-yellow-700">
      COPIAR
    </button>
  </div>
</div>

<!-- Mobile IP Section -->
<div class="md:hidden space-y-3 mb-6">
  <div class="bg-gray-800 border-4 border-gray-600 rounded-lg overflow-hidden">
    <div class="px-3 py-2 bg-gray-700 border-b-2 border-gray-600">
      <span class="text-gray-300 font-minecraft-sign text-xs">IP DO SERVIDOR</span>
    </div>
    <div class="p-3">
      <input
        type="text"
        readonly
        [value]="ip()"
        class="w-full px-3 py-2 mb-2 bg-gray-900 border-2 border-gray-700 rounded text-white font-minecraft-sign text-sm focus:outline-none" />
      <button
        (click)="copyIp()"
        class="w-full px-4 py-2 bg-yellow-600 hover:bg-yellow-700 text-black font-minecraft text-sm font-bold rounded transition-colors">
        COPIAR IP
      </button>
    </div>
  </div>
  <div class="bg-gray-800 border-4 border-gray-600 rounded-lg overflow-hidden">
    <div class="px-3 py-2 bg-gray-700 border-b-2 border-gray-600">
      <span class="text-gray-300 font-minecraft-sign text-xs">PORTA</span>
    </div>
    <div class="p-3">
      <input
        type="text"
        readonly
        [value]="port()"
        class="w-full px-3 py-2 mb-2 bg-gray-900 border-2 border-gray-700 rounded text-white font-minecraft-sign text-sm focus:outline-none" />
      <button
        (click)="copyPort()"
        class="w-full px-4 py-2 bg-yellow-600 hover:bg-yellow-700 text-black font-minecraft text-sm font-bold rounded transition-colors">
        COPIAR PORTA
      </button>
    </div>
  </div>
</div>
