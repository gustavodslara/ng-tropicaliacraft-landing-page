<!-- Mobile Tabs -->
<div class="md:hidden mb-6">
  <div class="grid grid-cols-2 gap-2">
    @for (server of servers(); track $index) {
    <button
      (click)="selectTab($index)"
      [class.ring-4]="selectedIndex() === $index"
      [class.ring-yellow-500]="selectedIndex() === $index"
      class="relative group overflow-hidden rounded-lg border-4 transition-all duration-300"
      [ngClass]="{
        'border-yellow-500 bg-yellow-500/20': selectedIndex() === $index,
        'border-gray-600 bg-gray-800 hover:border-gray-500': selectedIndex() !== $index
      }">
      <img
        [src]="server.image"
        [alt]="server.name"
        class="w-full h-24 object-cover"
        [ngClass]="{
          'brightness-110 contrast-110': selectedIndex() === $index,
          'brightness-75 group-hover:brightness-90': selectedIndex() !== $index
        }" />
      <div
        class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex items-end justify-center pb-2">
        <span class="font-minecraft-sign text-white text-xs sm:text-sm font-bold drop-shadow-lg">
          {{ server.name }}
        </span>
      </div>
      @if (selectedIndex() === $index) {
      <div class="absolute top-2 right-2 w-3 h-3 bg-green-500 rounded-full animate-pulse shadow-lg"></div>
      }
    </button>
    }
  </div>
</div>

<!-- Desktop Tabs -->
<div class="hidden md:block mb-8">
  <div class="flex space-x-3 justify-center">
    @for (server of servers(); track $index) {
    <button
      (click)="selectTab($index)"
      [class.ring-4]="selectedIndex() === $index"
      [class.ring-yellow-500]="selectedIndex() === $index"
      class="relative group overflow-hidden rounded-lg border-4 transition-all duration-300 w-48"
      [ngClass]="{
        'border-yellow-500 bg-yellow-500/20 scale-105': selectedIndex() === $index,
        'border-gray-600 bg-gray-800 hover:border-gray-500 hover:scale-102': selectedIndex() !== $index
      }">
      <img
        [src]="server.image"
        [alt]="server.name"
        class="w-full h-32 object-cover"
        [ngClass]="{
          'brightness-110 contrast-110': selectedIndex() === $index,
          'brightness-75 group-hover:brightness-90': selectedIndex() !== $index
        }" />
      <div
        class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent flex items-end justify-center pb-3">
        <span class="font-minecraft-sign text-white text-base font-bold drop-shadow-lg">
          {{ server.name }}
        </span>
      </div>
      @if (selectedIndex() === $index) {
      <div class="absolute top-3 right-3 w-4 h-4 bg-green-500 rounded-full animate-pulse shadow-lg"></div>
      }
    </button>
    }
  </div>
</div>
