<!-- Mobile Layout: Selected Large on Right, Others Stacked on Left -->
<div class="md:hidden mb-8">
  <div class="flex gap-3 max-w-2xl mx-auto h-64 mb-4">
    <!-- Left side: Unselected servers stacked -->
    <div class="flex flex-col gap-3 w-2/5">
      @for (server of servers(); track server.id || $index; let i = $index) {
        @if (selectedIndex() !== i) {
        <button
          (click)="selectTab(i)"
          class="server-tab-card-mobile flex-1 relative"
        >
          <img [src]="server.image" [alt]="server.name" class="w-full h-full object-cover" />
          <!-- Player Count Badge for unselected -->
          @if (server.playerCount) {
          <div class="absolute top-1 left-1 bg-black/70 text-white px-1.5 py-0.5 rounded border border-gray-600 font-minecraft-sign text-[10px] flex items-center space-x-1">
            @if (isLoadingPlayerCounts()) {
            <div class="animate-spin rounded-full h-2 w-2 border border-white border-t-transparent"></div>
            } @else {
            <span class="text-green-400">●</span>
            <span>{{ server.playerCount }}</span>
            }
          </div>
          }
          <div class="server-tab-label">{{ server.name }}</div>
        </button>
        }
      }
    </div>

    <!-- Right side: Selected server large -->
    <div class="w-3/5">
      <button class="server-tab-card-mobile active w-full h-full relative">
        <img [src]="getSelectedServer().image" [alt]="getSelectedServer().name" class="w-full h-full object-cover" />
        <!-- Player Count Badge -->
        @if (getSelectedServer().playerCount) {
        <div class="absolute top-2 left-2 bg-black/70 text-white px-2 py-1 rounded border-2 border-gray-600 font-minecraft-sign text-xs flex items-center space-x-1">
          @if (isLoadingPlayerCounts()) {
          <div class="animate-spin rounded-full h-3 w-3 border-2 border-white border-t-transparent"></div>
          } @else {
          <span class="text-green-400">●</span>
          <span>{{ getSelectedServer().playerCount }}</span>
          }
        </div>
        }
        <div class="server-tab-label-large">{{ getSelectedServer().name }}</div>
      </button>
    </div>
  </div>
  
  <!-- View Map Button - Mobile (centered below tabs) -->
  <div class="flex justify-center">
    <a 
      href="#mapa-ao-vivo" 
      class="minecraft-map-button inline-flex items-center gap-2 px-4 py-2 font-minecraft-sign text-xs hover:scale-105 transition-transform"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
      </svg>
      <span class="whitespace-nowrap">VER MAPA AO VIVO</span>
    </a>
  </div>
</div>

<!-- Desktop Layout: Grid with Center Priority + Map Button -->
<div class="hidden md:block mb-8">
  <div class="grid grid-cols-3 gap-4 lg:gap-6 max-w-5xl mx-auto mb-6">
    @for (server of servers(); track server.id || $index; let i = $index) {
    <button
      (click)="selectTab(i)"
      [class]="selectedIndex() === i ? 'server-tab-card active' : 'server-tab-card'"
      [class.order-2]="i === 1"
      [class.order-1]="i === 0"
      [class.order-3]="i === 2"
      class="w-full transition-all duration-300 relative"
    >
      <img [src]="server.image" [alt]="server.name" class="w-full h-full object-cover" />
      <!-- Player Count Badge -->
      @if (server.playerCount) {
      <div class="absolute top-3 left-3 bg-black/70 text-white px-3 py-1.5 rounded border-2 border-gray-600 font-minecraft-sign text-sm flex items-center space-x-2">
        @if (isLoadingPlayerCounts()) {
        <div class="animate-spin rounded-full h-3 w-3 border-2 border-white border-t-transparent"></div>
        } @else {
        <span class="text-green-400">●</span>
        <span>{{ server.playerCount }}</span>
        }
      </div>
      }
      <div class="server-tab-name">{{ server.name }}</div>
    </button>
    }
  </div>
  
  <!-- View Map Button - Desktop (centered below tabs) -->
  <div class="flex justify-center">
    <a 
      href="#mapa-ao-vivo" 
      class="minecraft-map-button inline-flex items-center gap-2 px-5 py-3 font-minecraft-sign text-sm hover:scale-105 transition-transform"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
      </svg>
      <span class="whitespace-nowrap">VER MAPA AO VIVO</span>
    </a>
  </div>
</div>
