@if (visible()) {
<div class="fixed inset-0 z-[100] flex items-center justify-center p-2 sm:p-4 animate-fade-in">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black bg-opacity-75" (click)="closeModal()"></div>

  <!-- Modal Container -->
  <div class="relative bg-gray-800 border-4 sm:border-8 border-gray-900 rounded-lg max-w-7xl w-full max-h-[95vh] overflow-y-auto shadow-2xl animate-modal-slide-down">
    <!-- Close Button -->
    <button
      (click)="closeModal()"
      class="absolute top-2 right-2 sm:top-4 sm:right-4 text-white hover:text-red-500 transition-colors z-10 bg-gray-900 rounded-full p-1"
      aria-label="Close modal"
    >
      <svg class="w-6 h-6 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Modal Content -->
    <div class="p-4 sm:p-6 md:p-8 lg:p-10">
      <h2 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-minecraft text-center text-yellow-400 mb-4 sm:mb-6 md:mb-8">
        PLANOS VIP
      </h2>

      <!-- VIP Tier Cards with Block Breaking Animation -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6 md:gap-8 items-stretch">
        @for (block of tiers(); track block.title; let i = $index) {
        <div class="minecraft-block-card flex flex-col">
          <div
            class="aspect-square flex items-center justify-center relative block-container"
            [ngClass]="{
              'minecraft-iron-block': i === 0,
              'minecraft-gold-block': i === 1,
              'minecraft-diamond-block': i === 2
            }"
          >
            <!-- Breaking overlay -->
            <div class="block-breaking-overlay"></div>
            <!-- Particle container -->
            <div class="block-particles"></div>
          </div>
          <div class="p-3 sm:p-4 md:p-6 text-center bg-gray-800 flex flex-col flex-grow">
            <h3 class="text-lg sm:text-xl md:text-2xl font-minecraft mb-2" [ngClass]="{
              'text-gray-400': i === 0,
              'text-orange-400': i === 1,
              'text-cyan-400': i === 2
            }">
              {{ block.title }}
            </h3>
            <p class="text-white font-minecraft-sign text-[10px] sm:text-xs leading-relaxed whitespace-pre-line mb-3 sm:mb-4 flex-grow">
              {{ block.description }}
            </p>
            <div class="text-xl sm:text-2xl font-minecraft-sign mb-3 whitespace-nowrap" [ngClass]="{
              'text-gray-300': i === 0,
              'text-orange-300': i === 1,
              'text-cyan-300': i === 2
            }">
              {{ block.price }}
            </div>
            <button class="minecraft-ui-button w-full py-2 sm:py-3 px-3 sm:px-4 font-minecraft-sign text-xs sm:text-sm hover:scale-105 transition-transform">
              ADQUIRIR VIP
            </button>
          </div>
        </div>
        }
      </div>
    </div>
  </div>
</div>
}
